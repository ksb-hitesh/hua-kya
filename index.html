<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<title>Out Time</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --fg:#e6e8eb; --dim:#8b929e; --ok:#3ddc84; --warn:#ffb020; --line:#262b34; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100svh; background:var(--bg); color:var(--fg);
         font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         display:flex; flex-direction:column; align-items:center; justify-content:center;
         padding:24px 18px calc(24px + env(safe-area-inset-bottom)); gap:18px; }
  h1 { font-size:1.05rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin:0; }
  .card { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line);
          border-radius:18px; padding:22px; display:flex; flex-direction:column; gap:14px; }
  .count { font-size:clamp(3rem,18vw,5rem); font-weight:700; letter-spacing:-.02em;
           font-variant-numeric:tabular-nums; text-align:center; margin:0; user-select:none; line-height:1.05; }
  .count.done { color:var(--ok); }
  .count.near { color:var(--warn); }
  .label { text-align:center; color:var(--dim); font-size:.78rem; letter-spacing:.16em; text-transform:uppercase; }
  .out { text-align:center; font-size:1.5rem; font-weight:600; font-variant-numeric:tabular-nums; }
  .bar { height:6px; background:#0b0d11; border-radius:99px; overflow:hidden; }
  .bar > i { display:block; height:100%; width:0; background:var(--ok); transition:width .4s linear; }
  button, input { font:inherit; color:var(--fg); }
  button { min-height:48px; border-radius:12px; border:1px solid var(--line); background:#20242d; cursor:pointer; padding:0 16px; }
  button:active { transform:scale(.98); }
  .primary { background:var(--ok); color:#06210f; font-weight:700; border-color:transparent; }
  input[type=time] { width:100%; min-height:52px; text-align:center; font-size:1.6rem; font-weight:600;
                     background:#0b0d11; border:1px solid var(--line); border-radius:12px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:10px;
         border-top:1px solid var(--line); padding-top:14px; font-size:.9rem; color:var(--dim); }
  .step { display:flex; align-items:center; gap:8px; }
  .step button { min-width:40px; min-height:40px; padding:0; font-size:1.2rem; }
  .step b { color:var(--fg); font-variant-numeric:tabular-nums; min-width:5ch; text-align:center; }
  .note { max-width:420px; text-align:center; color:var(--dim); font-size:.78rem; margin:0; }
  #banner { display:none; background:var(--ok); color:#06210f; font-weight:700; text-align:center;
            border-radius:12px; padding:12px; }
  .hide { display:none !important; }
</style>
</head>
<body>

<h1>Shift out-time</h1>

<section id="punch" class="card">
  <div class="label">When did you clock in?</div>
  <input id="t" type="time">
  <button id="setBtn">Use this time</button>
  <button id="nowBtn" class="primary">I'm in right now</button>
</section>

<section id="run" class="card hide">
  <div class="label">Time left</div>
  <p id="count" class="count">--:--:--</p>
  <div id="banner">You can leave now</div>
  <div class="out">Out at <span id="outAt">--:--</span></div>
  <div class="bar"><i id="fill"></i></div>
  <div class="row">
    <span>In <b id="inAt" style="color:var(--fg)">--:--</b></span>
    <span class="step" title="Safety margin">
      <button id="minus">−</button><b id="bufV">+2m</b><button id="plus">+</button>
    </span>
    <button id="reset">Reset</button>
  </div>
</section>

<p class="note" id="note">9h 30m door-to-door. Keep this tab open — phones freeze background timers.</p>

<script>
const H = 9.5 * 3600e3, WARN = 15 * 60e3;
const outAt = (inMs, buf) => inMs + H + buf * 60e3;
const fmt = ms => {
  const t = Math.max(0, Math.round(ms / 1000));
  return [t / 3600, (t / 60) % 60, t % 60].map(n => String(n | 0).padStart(2, '0')).join(':');
};
const clock = ms => new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

if (new URLSearchParams(location.search).has('test')) {
  const eq = (a, b, m) => console.assert(a === b, 'FAIL ' + m, a, '!=', b);
  const t9 = +new Date(2026, 0, 1, 9, 0);
  eq(outAt(t9, 0), +new Date(2026, 0, 1, 18, 30), 'plain 9.5h');
  eq(outAt(t9, 2), +new Date(2026, 0, 1, 18, 32), 'buffer applied');
  eq(new Date(outAt(+new Date(2026, 0, 1, 21, 0), 0)).getHours(), 6, 'midnight rollover');
  eq(fmt(3661000), '01:01:01', 'fmt');
  eq(fmt(H), '09:30:00', 'fmt 9.5h');
  eq(fmt(-5000), '00:00:00', 'fmt clamps negative');
  console.log('tests ran — any FAIL lines above are failures');
}

const $ = id => document.getElementById(id);
let inMs = +localStorage.inMs || 0;
let buf = localStorage.buf == null ? 2 : +localStorage.buf;
let firedWarn = true, firedOut = true, ac;

// stale shift (yesterday's) clears itself 6h after its out-time
if (inMs && Date.now() > outAt(inMs, buf) + 6 * 3600e3) inMs = 0;

function save() { localStorage.inMs = inMs; localStorage.buf = buf; }

function arm() {                       // don't fire retroactively for alerts already past
  const out = outAt(inMs, buf), now = Date.now();
  firedWarn = now >= out - WARN;
  firedOut = now >= out;
}

function alert_(title, body) {
  try { if (window.Notification && Notification.permission === 'granted') new Notification(title, { body, tag: 'out' }); } catch {}
  try { const o = ac.createOscillator(); o.connect(ac.destination); o.frequency.value = 880; o.start(); o.stop(ac.currentTime + .4); } catch {}
  $('banner').textContent = title;
  $('banner').style.display = 'block';
}

function start(ms) {
  inMs = ms; save(); arm();
  try { (ac ||= new (window.AudioContext || window.webkitAudioContext)()).resume(); } catch {}
  try { window.Notification && Notification.requestPermission(); } catch {}
  render();
}

function tick() {
  if (!inMs) return;
  const out = outAt(inMs, buf), left = out - Date.now();
  const c = $('count');
  c.textContent = (left < 0 ? '+' : '') + fmt(Math.abs(left));
  c.className = 'count' + (left <= 0 ? ' done' : left <= WARN ? ' near' : '');
  $('fill').style.width = Math.min(100, 100 * (1 - left / (out - inMs))) + '%';
  document.title = (left <= 0 ? '✅ ' : '') + fmt(Math.abs(left)) + ' · Out Time';
  if (!firedWarn && left <= WARN) { firedWarn = true; alert_('15 minutes left', 'Out at ' + clock(out)); }
  if (!firedOut && left <= 0) { firedOut = true; alert_('You can leave now', '9h 30m done at ' + clock(out)); }
}

function render() {
  $('punch').classList.toggle('hide', !!inMs);
  $('run').classList.toggle('hide', !inMs);
  if (!inMs) { document.title = 'Out Time'; return; }
  $('outAt').textContent = clock(outAt(inMs, buf));
  $('inAt').textContent = clock(inMs);
  $('bufV').textContent = '+' + buf + 'm';
  $('banner').style.display = 'none';
  tick();
}

$('nowBtn').onclick = () => start(Date.now());
$('setBtn').onclick = () => {
  const [h, m] = ($('t').value || '').split(':').map(Number);
  if (isNaN(h)) return;
  const d = new Date(); d.setHours(h, m, 0, 0); start(+d);
};
$('reset').onclick = () => { if (confirm('Clear today’s clock-in?')) { inMs = 0; save(); render(); } };
$('minus').onclick = () => { buf = Math.max(0, buf - 1); save(); arm(); render(); };
$('plus').onclick = () => { buf = Math.min(60, buf + 1); save(); arm(); render(); };

const n = new Date();
$('t').value = String(n.getHours()).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0');
if (inMs) arm();
render();
setInterval(tick, 1000);
document.addEventListener('visibilitychange', tick);
if (!window.isSecureContext) $('note').textContent = 'Served over plain http — system notifications are blocked by the browser. You still get the beep, the banner, and the countdown in the tab title.';
</script>
</body>
</html>
